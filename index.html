<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Gallery</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background: linear-gradient(135deg, #fff0f6, #ffe4ec);
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            color: #d63384;
            margin-bottom: 30px;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: 600;
            color: #b03070;
        }

        .search-input,
        select,
        input {
            padding: 10px;
            border: 1px solid #ffb6d5;
            border-radius: 15px;
            outline: none;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
        }

        .student-card {
            background: linear-gradient(145deg, #ffffff, #ffeaf3);
            border: 2px solid #ffb6d5;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.25);
            transition: 0.3s;
            text-align: center;
        }

        .student-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.4);
        }

        .student-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 25px auto 10px;
            display: block;
            border: 6px solid #ff69b4;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
        }

        .student-info {
            padding: 20px;
        }

        .student-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d63384;
            margin-bottom: 10px;
        }

        .cute-description {
            color: #7a315a;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .student-details {
            color: #6c4a5f;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .student-details div {
            margin-bottom: 5px;
        }

        .speciality-buttons {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .speciality-buttons button {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            padding: 9px 15px;
            margin: 5px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 12px rgba(255, 20, 147, 0.25);
        }

        .speciality-buttons button:hover {
            transform: scale(1.08);
            background: linear-gradient(45deg, #ff1493, #ff69b4);
        }

        .grade-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #ffe0ef;
            color: #c2185b;
            border: 1px solid #ff9ecb;
        }

        .btn-add {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            font-size: 2rem;
            box-shadow: 0 8px 20px rgba(255, 20, 147, 0.35);
            cursor: pointer;
        }

        .btn-add:hover {
            transform: translateY(-3px);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 25px;
            padding: 30px;
            width: 90%;
            max-width: 480px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #b03070;
        }

        .form-group input,
        .form-group select {
            width: 100%;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel,
        .btn-save {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            background: #f1f1f1;
        }

        .btn-save {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Students Gallery</h1>

        <div class="filters">
            <div class="filter-group">
                <label>Search:</label>
                <input type="text" class="search-input" id="searchInput" placeholder="Search by name...">
            </div>

            <div class="filter-group">
                <label>Grade:</label>
                <select id="gradeFilter">
                    <option value="all">All Grades</option>
                    <option value="A">Grade A</option>
                    <option value="A-">Grade A-</option>
                    <option value="B+">Grade B+</option>
                    <option value="B">Grade B</option>
                    <option value="B-">Grade B-</option>
                    <option value="C">Grade C</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Age:</label>
                <select id="ageFilter">
                    <option value="all">All Ages</option>
                    <option value="29">29</option>
                    <option value="20">20</option>
                    <option value="19">19</option>
                    <option value="18">18</option>
                </select>
            </div>
        </div>

        <div class="gallery" id="gallery"></div>
    </div>

    <button class="btn-add" id="addStudentBtn">+</button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>Add New Student</h2>

            <form id="addStudentForm">
                <div class="form-group">
                    <label for="studentName">Name</label>
                    <input type="text" id="studentName" required placeholder="Enter student name">
                </div>

                <div class="form-group">
                    <label for="studentGrade">Grade</label>
                    <select id="studentGrade" required>
                        <option value="">Select grade</option>
                        <option value="A">A</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="B-">B-</option>
                        <option value="C">C</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="studentAge">Age</label>
                    <input type="number" id="studentAge" required min="15" max="35" placeholder="Enter age">
                </div>

                <div class="form-group">
                    <label for="studentAvatar">Avatar URL</label>
                    <input type="url" id="studentAvatar" required placeholder="https://example.com/avatar.jpg">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const students = [
            {
                id: 1,
                name: "Zarrad Nourhene",
                grade: "A",
                age: 29,
                avatar: "https://scontent.ftun8-1.fna.fbcdn.net/v/t39.30808-6/642762741_10232220288951498_899608227372902462_n.jpg?_nc_cat=110&ccb=1-7&_nc_sid=1d70fc&_nc_ohc=60Pum34jQvAQ7kNvwGHNqoc&_nc_oc=AdrdU-dHZVmmBdh8bTY89xOmKkc49JR2SkkX32f7VGkArirO8G281DpAk3yh6EGM2Ls&_nc_zt=23&_nc_ht=scontent.ftun8-1.fna&_nc_gid=6OHtoj3Janeccf6KjE-O8Q&_nc_ss=7b2a8&oh=00_Af47ksn0C-h3cC-Qo7RZPbDJ45qnW-r2icqjMkc52f1ugQ&oe=6A051B7D"
            }
        ];

        function getGradeClass(grade) {
            if (grade.startsWith('A')) return 'grade-a';
            if (grade.startsWith('B')) return 'grade-b';
            return 'grade-c';
        }

        function renderStudents(data) {
            const gallery = document.getElementById('gallery');

            if (data.length === 0) {
                gallery.innerHTML = '<div class="no-results">No students found matching your criteria.</div>';
                return;
            }

            gallery.innerHTML = data.map(student => `
                <div class="student-card">
                    <img class="student-avatar" src="${student.avatar}" alt="${student.name}" loading="lazy">

                    <div class="student-info">
                        <div class="student-name">${student.name}</div>

                        <p class="cute-description">
                            Future DevOps & Cloud Engineer, passionate about automation, Git, CI/CD and modern technologies 🌸
                        </p>

                        <div class="student-details">
                            <div>Grade: ${student.grade}</div>
                            <div>Age: ${student.age}</div>
                        </div>

                        <div class="speciality-buttons">
                            <button>DevOps</button>
                            <button>Cloud</button>
                            <button>GitHub</button>
                            <button>CI/CD</button>
                        </div>

                        <span class="grade-badge ${getGradeClass(student.grade)}">${student.grade}</span>
                    </div>
                </div>
            `).join('');
        }

        function filterStudents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const gradeFilter = document.getElementById('gradeFilter').value;
            const ageFilter = document.getElementById('ageFilter').value;

            const filtered = students.filter(student => {
                const matchesSearch = student.name.toLowerCase().includes(searchTerm);
                const matchesGrade = gradeFilter === 'all' || student.grade === gradeFilter;
                const matchesAge = ageFilter === 'all' || student.age === parseInt(ageFilter);

                return matchesSearch && matchesGrade && matchesAge;
            });

            renderStudents(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterStudents);
        document.getElementById('gradeFilter').addEventListener('change', filterStudents);
        document.getElementById('ageFilter').addEventListener('change', filterStudents);

        renderStudents(students);

        const modalOverlay = document.getElementById('modalOverlay');
        const addStudentBtn = document.getElementById('addStudentBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const addStudentForm = document.getElementById('addStudentForm');

        addStudentBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        cancelBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });

        addStudentForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const newStudent = {
                id: students.length + 1,
                name: document.getElementById('studentName').value,
                grade: document.getElementById('studentGrade').value,
                age: parseInt(document.getElementById('studentAge').value),
                avatar: document.getElementById('studentAvatar').value
            };

            students.push(newStudent);
            renderStudents(students);
            filterStudents();
            addStudentForm.reset();
            modalOverlay.classList.remove('active');
        });
    </script>

</body>

</html>
